# Transforma os dados do schema raw até o esquema estrela
name: 'chikungunya'
version: '1.0.0'
profile: 'chikungunya'

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  chikungunya:
    staging:          # schema elt_staging
      +schema: staging
      +materialized: view
    marts:            # schema elt_dw
      +schema: dw
      +materialized: table
